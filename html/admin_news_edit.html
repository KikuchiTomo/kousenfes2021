<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ニュース編集・追加 | 高専祭管理者ページ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/admin_news_edit.css">
    <link rel="stylesheet" href="css/style.css">    
</head>

<body>
    <div class="side-menu">
        <div class="title"></div>
        <a href="/admin/dashboard">
            <i class="fas fa-home"></i>
            <span>DashBoard</span>
        </a>
        <a href="/admin/news/dashboard">
            <i class="fas fa-newspaper"></i>
            <span>News</span>
        </a>
        <a href="/admin/proj/dashboard">
            <i class="fas fa-calendar-alt"></i>
            <span>Projects</span>
        </a>
        <a href="/admin/bingo/dashboard">
            <i class="fas fa-dice"></i>
            <span>Bingo</span>
        </a>
        <a href="/admin/qr/dashboard">
            <i class="fas fa-qrcode"></i>
            <span>QR</span>
        </a>
        <a href="/admin/users/dashboard">
            <i class="fas fa-users"></i>
            <span>Users</span>
        </a>
        <a href="/admin/adnmins/dashboard">
            <i class="fas fa-users-cog"></i>
            <span>Admins</span>
        </a>
        <a href="/admin/logout">
            <i class="fas fa-sign-out-alt logout"></i>
            <span>Logout</span>
        </a>
    </div>
    <div class="main-content">
        <div class="menu">
            <a href="/admin/news/add" class="green">サーバにアップロード</a>&nbsp;
            <a href="/admin/news/delete?id=1" class="red">このニュースを削除</a>
        </div>
        <div class="main-container">
            <small>タイトル画像</small>
            <div>
                <input type="file" name="img" id="img">
            </div>
            <small>お知らせタイトル(TOPページに表示)</small>
            <input type="text" name="sub-title" maxlength="30" placeholder="例：ビンゴ大会まもなく開始">
            <small>お知らせ内容タイトル(詳細画面に表示)</small>
            <input type="text" name="tutle" maxlength="30" placeholder="例：ビンゴ大会がまもなく始まります">
            <small>お知らせサマリ内容(TOPページに表示)</small>
            <input type="text" name="sub-content" maxlength="40" placeholder="ぜひ参加してください。">
            <small>お知らせ内容(詳細画面に表示)<small>[Markdown形式]</small></small>
            <textarea name="content" id="content">
例)
## ビンゴ大会概要
### 開始日時
○○時○○分～
### 参加方法
下記URLでアカウントを作成し、ビンゴ大会に参加してください  
[リンク表示名](URL)
            </textarea>
            <small>お知らせ日時</small>
            <input type="datetime-local" name="datetime">
        </div>      
        <small>プレビュー</small>
        <div id="preview-area" class="preview">

        </div>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.onload = () => {
            var m = document.getElementById('content');

            m.addEventListener('keyup', () => {
                var view = document.getElementById('preview-area');
                var html = marked(document.getElementById('content').value);
                view.innerHTML = html;
            })
        }
    </script>
    </body>
</html>
