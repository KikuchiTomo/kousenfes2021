<!DOCTYPE html>
<html lang="ja" id="html">
  <head>
    <!--　覗いた人への言い訳: 結合テストも単体テストしてないので，バックエンド側にバグあるかもしれないけど，一応セキュリティの対策はしてます -->
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta charset="utf-8">
    <title>Sinup - 第53回 高専祭</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user.css">
    <script src="js/scroll_change_color.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.slim.min.js" integrity="sha256-u7e5khyithlIdTpu22PHhENmPcRdFiHRjhAuHcs05RI=" crossorigin="anonymous"></script>
    <script>
      function closeMenu(){
          let menu_elem = document.getElementById('menu-ham');
          menu_elem.checked = false;
      }
    </script>
  </head>
  <body id="body">
    <div class="loading" id="loading">
      <img src="favicon.ico">
    </div>
    
    <section id="top" class="user-top">
      <div class="top-background-img" id="top-backing">
      </div>
      <div class="top-background" id="top-bak">
        <div class="top-content">
          <div>
        </div>
      </div>
      
      <input type="checkbox" id="menu-ham">
      <label for="menu-ham" class="menu-button">
        <span id="hams" class="scroll-changed"></span>
      </label>
      <nav class="menu-container">
        <br>
        <a href="/">Top</a>
        <a href="/search" onclick="closeMenu()" class="current-page">Search</a>
        <a href="/news">News</a>
        <a href="/mypage">My Page</a>
      </nav>            
      <div class="menu-background scroll-changed" id="menu-bak">
        <h1><div class="header-img"></div></h1>
      </div>            
    </section>
    
    <section class="index-info">
      <div id="user-container" class="user">
        <h1>新規ユーザ登録</h1>
        <form method="post" accept-charset="utf-8">
            <p class="form-required">姓名</p>
            <div class="input-flex">
              <input name="last_name" type="text" maxlength="20" placeholder="姓" class="form input border-right-none">
              <input name="first_name" type="text" maxlength="20" placeholder="名" class="form input">
            </div> 
            <p class="form-required">ふりがな ( 姓名 ) </p>
            <div class="input-flex">
              <input name="last_name_h" type="text" maxlength="20" placeholder="ふりがな(姓)" class="form input border-right-none">
              <input type="first_name_h" maxlength="20" placeholder="ふりがな(名)" class="form input ">
            </div>
            <p class="form-required">種別</p>
            
            <div class="drop-down">
              <select name="status" class="form input" id="select-status">
                <option value="0000">種別を選択して下さい</option>
              </select>
              <label for="select-status">▼</label>
            </div>

            <input type="email" name="email" class="email" placeholder="Email Address" maxlength="60" minlength="3" pattern="^[a-zA-Z0-9.!#$&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$" required>
            <button type="submit" class="login">認証へ進む ＞</button>
        </form>
        <a href="/user_sinup" class="sinup">ユーザ新規登録の方はこちら</a>
        <a href="/user_reset">パスワードを忘れた方はこちら</a>
      </div>
     
        <div class="error-show">
            <div>
                メールアドレスかパスワードのどちらかが間違っています
            </div>
            <div>
                パスワードの有効期限が過ぎています
            </div>
        </div>
    </section>
    <footer>
      <p class="copyright"><small>&copy; 2021 Kousen Festival Committee (TMCIT-ACP). All Rights Reserved</small></p>
    </footer>
  </body>

</html>
