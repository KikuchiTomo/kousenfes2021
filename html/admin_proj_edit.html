<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>企画編集・追加 | 高専祭管理者ページ</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="css/admin_proj_edit.css">
    <link rel="stylesheet" href="css/style.css">    
</head>

<body>
  <div class="body">
    <div class="side-menu">
        <div class="title"></div>
        <a href="/admin/dashboard">
            <i class="fas fa-home"></i>
            <span>DashBoard</span>
        </a>
        <a href="/admin/news/dashboard">
            <i class="fas fa-newspaper"></i>
            <span>News</span>
        </a>
        <a href="/admin/proj/dashboard">
            <i class="fas fa-calendar-alt"></i>
            <span>Projects</span>
        </a>
        <a href="/admin/bingo/dashboard">
            <i class="fas fa-dice"></i>
            <span>Bingo</span>
        </a>
        <a href="/admin/qr/dashboard">
            <i class="fas fa-qrcode"></i>
            <span>QR</span>
        </a>
        <a href="/admin/users/dashboard">
            <i class="fas fa-users"></i>
            <span>Users</span>
        </a>
        <a href="/admin/adnmins/dashboard">
            <i class="fas fa-users-cog"></i>
            <span>Admins</span>
        </a>
        <a href="/admin/logout">
            <i class="fas fa-sign-out-alt logout"></i>
            <span>Logout</span>
        </a>
    </div>
    <div class="main-content">
        <div class="menu">
            <a href="/admin/proj/add" class="green">サーバにアップロード</a>&nbsp;
            <a href="/admin/proj/delete?id=1" class="red">この企画を削除</a>
        </div>
        <div class="main-container">
            <small>ICON画像</small>
            <div>
                <input type="file" name="img" id="img">
            </div>
            <small>ヘッダー画像</small>
            <div>
                <input type="file" name="img" id="img">
            </div>
            <small>企画タイトル</small>
            <input type="text" name="sub-title" maxlength="30" placeholder="例：ワクワクライブなど">
            <small>企画者名・組織名</small>
            <input type="text" name="tutle" maxlength="30" placeholder="例：〇〇部・〇〇同好会・〇〇研究室など">
            <small>企画場所</small>
            <select>
              <option>企画場所を選択してください</option>
              <option>第３講義室</option>
              <option>第２講義室</option>
              <option>第１講義室</option>
            </select>
            <small>企画種類</small>
            <select>
              <option>企画種類を選択してください</option>
              <option>オンライン(配信)</option>
              <option>オンライン(ライブ)</option>
              <option>展示</option>
            </select>
            <small>企画内容(詳細画面に表示)<small>[Markdown形式]</small></small>
            <textarea name="content" id="content">
例)
## ビンゴ大会概要
### 開始日時
○○時○○分～
### 参加方法
下記URLでアカウントを作成し、ビンゴ大会に参加してください  
[リンク表示名](URL)
            </textarea>
            <small>タグ</small>
            <textarea name="content" id="content">#タグを改行区切りで入力
            </textarea>
            <small>検索キーワード</small>
            <textarea name="content" id="content">改行区切りで入力
            </textarea>
            <small>プレビュー</small>
            <div id="preview-area" class="preview">

            </div>            
        </div>      
       
        
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        window.onload = () => {
            var m = document.getElementById('content');

            m.addEventListener('keyup', () => {
                var view = document.getElementById('preview-area');
                var html = marked(document.getElementById('content').value);
                view.innerHTML = html;
            })
        }
    </script>
    </div>
    </body>
</html>
