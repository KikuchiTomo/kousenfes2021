<!DOCTYPE html>

    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta charset="utf-8">
    <title>Login - 第53回 高専祭</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user.css">
    <script src="js/scroll_change_color.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.slim.min.js" integrity="sha256-u7e5khyithlIdTpu22PHhENmPcRdFiHRjhAuHcs05RI=" crossorigin="anonymous"></script>
    <script>
      function closeMenu(){
          let menu_elem = document.getElementById('menu-ham');
          menu_elem.checked = false;
      }
    </script>
  </head>
  <body id="body" class="scroll-bar scroll-bar-width">
    <div class="loading" id="loading">
      <img src="favicon.ico">
    </div>
    
    <section id="top" class="user-top">
      <div class="top-background-img" id="top-backing">
      </div>
      <div class="top-background" id="top-bak">
        <div class="top-content">
          <div>
        </div>
      </div>
      
      <input type="checkbox" id="menu-ham">
      <label for="menu-ham" class="menu-button">
        <span id="hams" class="scroll-changed"></span>
      </label>
      <nav class="menu-container">
        <br>
        <a href="/">Top</a>
        <a href="/search" onclick="closeMenu()" class="current-page">Search</a>
        <a href="/news">News</a>
        <a href="/mypage">My Page</a>
      </nav>            
      <div class="menu-background scroll-changed" id="menu-bak">
        <h1><div class="header-img"></div></h1>
      </div>            
    </section>
    
    <section class="index-info">
      <div id="user-container" class="user">
        <h1>パスワードリセット</h1>
        <form method="post" accept-charset="utf-8" action="/user_reset"> 
            <input type="email" name="name" class="email" placeholder="Email Address" maxlength="60" minlength="3" pattern="^[a-zA-Z0-9.!#$&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$" required>
            <button type="submit" class="login">RESET ＞</button>
        </form>
        <small class="reset-info">一時ログイン用パスワードがアカウントに登録されたメールアドレスに送信されます</small>
        <small class="reset-info">有効期限は30分です</small>
      </div>
     
        <div class="error-show">
            <div>
                ユーザが存在しません
            </div>
            <div>
                データベース上の整合性が取れていません．管理者へ連絡して下さい
                <a href="./" class="report">連絡はこちらから</a>
            </div>
        </div>
    </section>
    <footer>
      <p class="copyright"><small>&copy; 2021 Kousen Festival Committee (TMCIT-ACP). All Rights Reserved</small></p>
    </footer>
  </body>
